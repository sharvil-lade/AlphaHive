# prometheus.yml — Prometheus scrape configuration for AI Hedge Fund Analyst Platform
# Place this file in the project root and mount it into the Prometheus container.
#
# To start Prometheus alongside the stack:
#   docker compose --profile monitoring up -d

global:
  scrape_interval: 15s       # Poll metrics every 15 seconds
  evaluation_interval: 15s   # Evaluate alerting rules every 15 seconds

scrape_configs:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  - job_name: "hedge_fund_backend"
    static_configs:
      - targets: ["backend:8000"]   # Docker service name inside compose network
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Redis exporter (optional — add redis_exporter service to compose) ────────
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis_exporter:9121"]

  # ── Prometheus itself ────────────────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
