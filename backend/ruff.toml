line-length = 110
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[lint]
# E4/E7/E9/F/B catch real defects (undefined names, unused imports, shadowed builtins,
# mutable defaults). I/UP/W are formatting-adjacent but now enforceable, because
# `ruff format` runs over the whole tree in CI — they keep import order and modern
# syntax from drifting again.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "W"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() defaults are the framework's idiom
  "B904",  # raise ... from err inside except: worth doing, not worth blocking CI
]

[lint.per-file-ignores]
# Routers are imported after configure_logging() on purpose, so module-level loggers
# in those modules are created against the configured handlers.
"app/main.py" = ["E402"]
