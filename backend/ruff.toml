line-length = 110
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[lint]
# Deliberately narrow: rules that catch real defects (undefined names, unused imports,
# shadowed builtins, mutable defaults, except-without-raise), not formatting opinions.
# Cosmetic rule sets (I, UP, W) would flag ~500 pre-existing lines and make CI red
# without finding a single bug. Widen once the codebase is formatted.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() defaults are the framework's idiom
  "B904",  # raise ... from err inside except: worth doing, not worth blocking CI
]

[lint.per-file-ignores]
# Routers are imported after configure_logging() on purpose, so module-level loggers
# in those modules are created against the configured handlers.
"app/main.py" = ["E402"]
