<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        @page {
            size: a4;
            margin: 2.5cm 2cm 2.5cm 2cm;
            @frame header_frame {
                -pdf-frame-content: header_content;
                left: 2cm;
                right: 2cm;
                top: 1cm;
                height: 1cm;
            }
            @frame footer_frame {
                -pdf-frame-content: footer_content;
                left: 2cm;
                right: 2cm;
                bottom: 1cm;
                height: 1cm;
            }
        }
        
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.6;
            color: #1e293b;
        }

        h1 {
            font-size: 20pt;
            color: #0f172a;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 14pt;
            color: #1e3a8a;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
            margin-top: 25px;
            margin-bottom: 12px;
        }

        h3 {
            font-size: 11pt;
            color: #2563eb;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        p {
            margin-top: 0;
            margin-bottom: 12px;
            text-align: justify;
        }

        ul, ol {
            margin-top: 0;
            margin-bottom: 12px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        blockquote {
            background-color: #f8fafc;
            border-left: 4px solid #3b82f6;
            padding: 10px 15px;
            margin: 15px 0;
            color: #334155;
            font-style: italic;
        }

        /* Tables styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 9.5pt;
        }

        th {
            background-color: #1e3a8a;
            color: #ffffff;
            font-weight: bold;
            text-align: left;
            padding: 8px 10px;
            border: 1px solid #1e3a8a;
        }

        td {
            padding: 8px 10px;
            border: 1px solid #e2e8f0;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Utility classes */
        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .bold {
            font-weight: bold;
        }
        
        .header-title {
            font-size: 8pt;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
        }
        
        .footer-text {
            font-size: 8pt;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 4px;
        }
    </style>
</head>
<body>
    <!-- Header Frame Content -->
    <div id="header_content">
        <div class="header-title">
            AlphaHive &mdash; Private Research Memo
        </div>
    </div>

    <!-- Footer Frame Content -->
    <div id="footer_content">
        <table style="width: 100%; border: none; margin: 0; padding: 0;">
            <tr style="background: none;">
                <td class="footer-text" style="border: none; padding: 4px 0 0 0;">
                    Confidential &mdash; Institutional Investment Use Only
                </td>
                <td class="footer-text text-right" style="border: none; padding: 4px 0 0 0;">
                    Page <pdf:pagenumber> of <pdf:pagecount>
                </td>
            </tr>
        </table>
    </div>

    <!-- Main Content -->
    <div class="content">
        {{ content_html | safe }}
    </div>
</body>
</html>
